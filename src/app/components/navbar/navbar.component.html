<mat-toolbar class="app-toolbar mat-elevation-z4">
  <div class="toolbar-brand" routerLink="/vehiculos">
    <mat-icon class="brand-icon">local_parking</mat-icon>
    <span class="brand-title">SmartPark Manager</span>
  </div>

  <nav class="nav-links">
    <a mat-button routerLink="/vehiculos" routerLinkActive="active-link">
      <mat-icon>directions_car</mat-icon>
      <span>Vehículos</span>
    </a>
    <a mat-button routerLink="/estancias" routerLinkActive="active-link">
      <mat-icon>history</mat-icon>
      <span>Estancias</span>
    </a>
    <a mat-button routerLink="/residentes" routerLinkActive="active-link">
      <mat-icon>analytics</mat-icon>
      <span>Reporte Residentes</span>
    </a>
  </nav>

  <span class="toolbar-spacer"></span>

  <div class="action-bar">
    <button mat-raised-button class="btn-action btn-primary-action" (click)="openRegistrarEntrada()">
      <mat-icon>login</mat-icon>
      <span>Registrar Entrada</span>
    </button>
    <button mat-stroked-button (click)="openRegistrarSalida()" class="btn-action btn-outline-light">
      <mat-icon>logout</mat-icon>
      <span>Registrar Salida</span>
    </button>
    <button mat-button (click)="openAltaVehiculo()" class="btn-action" style="color: #ffffff;">
      <mat-icon>add_circle_outline</mat-icon>
      <span>Alta Vehículo</span>
    </button>
  </div>
</mat-toolbar>
